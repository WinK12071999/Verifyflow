# Demo hosting on Render (SQLite is ephemeral — fine for demos only)
services:
  - type: web
    name: verifyflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app db upgrade && flask --app app init-db && gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ORGANIZATION_NAME
        value: VerifyFlow
      - key: DATABASE_URL
        value: sqlite:///compliance.db
      - key: APP_BASE_URL
        sync: false
