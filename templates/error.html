{% extends "base.html" %}
{% block title %}{{ code }} — VerifyFlow{% endblock %}
{% block content %}
<section class="auth-panel">
  <div class="auth-card">
    <p class="eyebrow">Error {{ code }}</p>
    <h1>{{ title }}</h1>
    <p class="lead">{{ message }}</p>
    <div class="form-actions">
      <a class="btn btn-primary" href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}">Go back</a>
    </div>
  </div>
</section>
{% endblock %}
